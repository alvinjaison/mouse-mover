<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: layered solid rects (ImageMagick renders these reliably) -->
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="640" fill="#161b22" opacity="0.6"/>
  <circle cx="1030" cy="330" r="300" fill="#1f6feb" opacity="0.10"/>
  <circle cx="1030" cy="330" r="200" fill="#38bdf8" opacity="0.08"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="640" height="8" fill="#38bdf8"/>
  <rect x="640" y="0" width="640" height="8" fill="#34d399"/>

  <!-- Mouse glyph -->
  <g transform="translate(940,185)">
    <rect x="0" y="0" width="190" height="290" rx="95" fill="#0d1117" stroke="#38bdf8" stroke-width="11"/>
    <line x1="95" y1="26" x2="95" y2="120" stroke="#34d399" stroke-width="11" stroke-linecap="round"/>
    <!-- motion arcs on the right -->
    <path d="M 232 140 q 55 0 55 55" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M 232 100 q 90 0 90 95" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
    <!-- motion arcs on the left -->
    <path d="M -42 140 q -55 0 -55 55" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M -42 100 q -90 0 -90 95" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="90" y="250" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="bold" fill="#f0f6fc">Mouse Mover</text>
  <text x="92" y="320" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#9ca3af">A free, open-source mouse jiggler that</text>
  <text x="92" y="372" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#9ca3af">keeps your computer awake.</text>

  <!-- Platform pills -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold">
    <rect x="92" y="430" width="200" height="60" rx="30" fill="#1f6feb"/>
    <text x="192" y="470" fill="#ffffff" text-anchor="middle">Windows</text>

    <rect x="312" y="430" width="160" height="60" rx="30" fill="#30363d"/>
    <text x="392" y="470" fill="#e6edf3" text-anchor="middle">macOS</text>

    <rect x="492" y="430" width="150" height="60" rx="30" fill="#238636"/>
    <text x="567" y="470" fill="#ffffff" text-anchor="middle">MIT</text>
  </g>

  <!-- Footer -->
  <text x="92" y="560" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#6e7681">github.com/alvinjaison/mouse-mover  ·  No admin · No telemetry · Portable</text>
</svg>
